<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Ink Dashboard Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a1a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: system-ui, -apple-system, sans-serif;
            color: #fff;
        }

        .controls {
            padding: 16px;
            background: #2a2a2a;
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
        }

        .controls label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .controls select,
        .controls button {
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid #444;
            background: #333;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }

        .controls button:hover {
            background: #444;
        }

        .controls button.active {
            background: #0066cc;
            border-color: #0066cc;
        }

        .status {
            margin-left: auto;
            font-size: 12px;
            color: #888;
        }

        .viewer {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            overflow: auto;
        }

        .frame {
            background: #333;
            padding: 8px;
            border-radius: 8px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.5);
        }

        .screen {
            position: relative;
            width: 632px;
            height: 840px;
            background: #fff;
            overflow: hidden;
        }

        .screen img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
        }

        .screen.ghosting img {
            opacity: 0.85;
        }

        .ghost-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.15;
        }

        .info {
            padding: 8px 16px;
            background: #2a2a2a;
            font-size: 12px;
            color: #888;
            display: flex;
            gap: 24px;
        }
    </style>
</head>
<body>
    <div class="controls">
        <label>
            Grayscale:
            <select id="grayscale">
                <option value="256">Full (256)</option>
                <option value="16" selected>16 levels</option>
                <option value="8">8 levels</option>
                <option value="4">4 levels</option>
            </select>
        </label>

        <label>
            <input type="checkbox" id="ghosting">
            Ghosting simulation
        </label>

        <button id="refresh">Full Refresh</button>
        <button id="autoReload" class="active">Auto-reload (60s)</button>

        <span class="status" id="status">Ready</span>
    </div>

    <div class="viewer">
        <div class="frame">
            <div class="screen" id="screen">
                <img id="dashboard" src="../out/dashboard.png" alt="Dashboard">
                <img id="ghostLayer" class="ghost-layer" src="" alt="">
            </div>
        </div>
    </div>

    <div class="info">
        <span>Resolution: 1264x1680 @ 50% scale</span>
        <span id="lastUpdate">Last update: --</span>
        <span id="nextUpdate">Next update: --</span>
    </div>

    <script>
        const dashboard = document.getElementById('dashboard');
        const ghostLayer = document.getElementById('ghostLayer');
        const screen = document.getElementById('screen');
        const grayscaleSelect = document.getElementById('grayscale');
        const ghostingCheckbox = document.getElementById('ghosting');
        const refreshBtn = document.getElementById('refresh');
        const autoReloadBtn = document.getElementById('autoReload');
        const statusEl = document.getElementById('status');
        const lastUpdateEl = document.getElementById('lastUpdate');
        const nextUpdateEl = document.getElementById('nextUpdate');

        let autoReloadEnabled = true;
        let reloadTimeout = null;
        let countdownInterval = null;
        let previousImageSrc = null;
        let countdown = 60;
        const RELOAD_INTERVAL_SEC = 60;

        function updateStatus(msg) {
            statusEl.textContent = msg;
        }

        function updateTimestamps() {
            const now = new Date();
            lastUpdateEl.textContent = `Last update: ${now.toLocaleTimeString()}`;
        }

        function applyGrayscaleFilter(levels) {
            if (levels >= 256) {
                dashboard.style.filter = 'grayscale(100%)';
            } else {
                const contrast = 1 + (256 - levels) / 256;
                dashboard.style.filter = `grayscale(100%) contrast(${contrast})`;
            }
        }

        function reloadImage() {
            if (ghostingCheckbox.checked && dashboard.src) {
                previousImageSrc = dashboard.src;
                ghostLayer.src = previousImageSrc;
            }

            const timestamp = Date.now();
            dashboard.src = `../out/dashboard.png?t=${timestamp}`;
            updateTimestamps();
            updateStatus('Loading...');
        }

        function fullRefresh() {
            ghostLayer.src = '';
            previousImageSrc = null;
            screen.classList.remove('ghosting');
            reloadImage();
        }

        function startAutoReload() {
            stopAutoReload();

            countdown = RELOAD_INTERVAL_SEC;
            nextUpdateEl.textContent = `Next update: ${countdown}s`;

            countdownInterval = setInterval(() => {
                countdown--;
                nextUpdateEl.textContent = `Next update: ${countdown}s`;
            }, 1000);

            reloadTimeout = setTimeout(() => {
                reloadImage();
                if (autoReloadEnabled) {
                    startAutoReload();
                }
            }, RELOAD_INTERVAL_SEC * 1000);
        }

        function stopAutoReload() {
            if (reloadTimeout) {
                clearTimeout(reloadTimeout);
                reloadTimeout = null;
            }
            if (countdownInterval) {
                clearInterval(countdownInterval);
                countdownInterval = null;
            }
            nextUpdateEl.textContent = 'Next update: paused';
        }

        grayscaleSelect.addEventListener('change', () => {
            applyGrayscaleFilter(parseInt(grayscaleSelect.value));
        });

        ghostingCheckbox.addEventListener('change', () => {
            if (ghostingCheckbox.checked) {
                screen.classList.add('ghosting');
            } else {
                screen.classList.remove('ghosting');
                ghostLayer.src = '';
            }
        });

        refreshBtn.addEventListener('click', fullRefresh);

        autoReloadBtn.addEventListener('click', () => {
            autoReloadEnabled = !autoReloadEnabled;
            autoReloadBtn.classList.toggle('active', autoReloadEnabled);

            if (autoReloadEnabled) {
                startAutoReload();
            } else {
                stopAutoReload();
            }
        });

        dashboard.addEventListener('error', () => {
            updateStatus('Image not found - run renderer first');
        });

        dashboard.addEventListener('load', () => {
            updateStatus('Loaded');
        });

        applyGrayscaleFilter(16);
        startAutoReload();
        updateTimestamps();
    </script>
</body>
</html>
